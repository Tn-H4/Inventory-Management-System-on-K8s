# Test profile properties
# These values are read by Spring's DataSource bean.
# RepositoryImpl classes connect via DatabaseConfig.getConnection() which delegates
# to the Spring-managed DataSource.

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/inventory_db_test}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:dorecefa}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT secret — must be present or JwtUtils fails to initialize.
# Use any string >= 32 chars in test profile.
secreteJwtString=TestSecretKeyForIntegrationTestsMustBeLongEnough32Chars