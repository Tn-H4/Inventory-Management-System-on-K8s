# ==============================================================================
# SECRETS TEMPLATE
# For security: Replace with your actual passwords before running kubectl apply
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: ims
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  MYSQL_DATABASE: "inventory_db"
  MYSQL_USER: "ims_user"
  MYSQL_PASSWORD: "CHANGE_ME_USER_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: ims
type: Opaque
stringData:
  DB_URL: "jdbc:mysql://mysql:3306/inventory_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false"
  DB_USERNAME: "root"
  DB_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_32_BYTES_MINIMUM_HEX_KEY"
