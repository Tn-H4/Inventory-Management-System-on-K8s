# kind cluster config: 1 control-plane (master) + 1 worker
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ims-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose frontend NodePort on host :30000
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      # Expose backend NodePort on host :30050
      - containerPort: 30050
        hostPort: 30050
        protocol: TCP
  - role: worker

