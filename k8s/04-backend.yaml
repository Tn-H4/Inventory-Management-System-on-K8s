apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Wait until MySQL is ready before starting Spring Boot
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until nc -z mysql 3306; do
                echo "  MySQL not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "MySQL is up!"
      containers:
        - name: backend
          # In GCP Artifact Registry: asia-southeast1-docker.pkg.dev/<YOUR_PROJECT_ID>/ims-repo/ims-backend:v1
          # In local kind: ims-backend:latest
          image: asia-southeast1-docker.pkg.dev/YOUR_PROJECT_ID/ims-repo/ims-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /swagger-ui/index.html
              port: 5050
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /swagger-ui/index.html
              port: 5050
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ims
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 5050
      targetPort: 5050
      nodePort: 30050

